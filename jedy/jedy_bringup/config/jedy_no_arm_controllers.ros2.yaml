controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: "mecanum_drive_controller/MecanumDriveController"

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_command_joint_name: "front_left_wheel_joint"
    front_right_wheel_command_joint_name: "front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "rear_left_wheel_joint"
    rear_right_wheel_command_joint_name: "rear_right_wheel_joint"
    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.05
      sum_of_robot_center_projection_on_X_Y_axis: 0.16
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 0.1
        has_acceleration_limits: true
        max_acceleration: 20.0
      y:
        has_velocity_limits: true
        max_velocity: 0.1
        has_acceleration_limits: true
        max_acceleration: 20.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 4.0
        has_acceleration_limits: true
        max_acceleration: 25.0
