controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: "mecanum_drive_controller/MecanumDriveController"
      front_left_wheel_joint: "mechanum_joint2"
      back_left_wheel_joint: "mechanum_joint4"
      front_right_wheel_joint: "mechanum_joint1"
      back_right_wheel_joint: "mechanum_joint3"
      publish_rate: 50
      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.03]
      cmd_vel_timeout: 0.25
      enable_odom_tf: true
      base_frame_id: base_link
      wheel_separation_x: 0.638
      wheel_separation_y: 0.551
      wheel_separation_multiplier: 1.5
      wheel_radius_multiplier: 1.0
      linear:
        x:
          has_velocity_limits: true
          max_velocity: 0.1
          has_acceleration_limits: true
          max_acceleration: 20.0
        y:
          has_velocity_limits: true
          max_velocity: 0.1
          has_acceleration_limits: true
          max_acceleration: 20.0
      angular:
        z:
          has_velocity_limits: true
          max_velocity: 4.0
          has_acceleration_limits: true
          max_acceleration: 25.0
