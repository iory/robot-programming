
# ROS2 Controller Configuration for Jedy

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: "diff_drive_controller/DiffDriveController"
      left_wheel_names: ['front_left_wheel_joint', 'rear_left_wheel_joint']
      right_wheel_names: ['front_right_wheel_joint', 'rear_right_wheel_joint']
      publish_rate: 20
      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.1]
      twist_covariance_diagonal: [0.001, 0.001, 0.001, 1000000.0, 1000000.0, 0.1]
      cmd_vel_timeout: 0.25
      enable_odom_tf: true
      base_frame_id: base_link
      wheel_separation_multiplier: 1.0
      wheel_radius_multiplier: 1.0
      linear.x.has_velocity_limits: true
      linear.x.max_velocity: 0.1
      linear.x.has_acceleration_limits: true
      linear.x.max_acceleration: 0.1
      angular.z.has_velocity_limits: true
      angular.z.max_velocity: 1.0
      angular.z.has_acceleration_limits: true
      angular.z.max_acceleration: 1.0

    fullbody_controller:
      type: joint_trajectory_controller/JointTrajectoryController
      joints:
        - head_joint0
        - head_joint1
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
